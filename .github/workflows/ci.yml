name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban-local-only
          POSTGRES_DB: kanban
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U kanban -d kanban"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kanban:kanban-local-only@127.0.0.1:15433/kanban?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      # Waves and progress weeks are UTC: the API must not depend on the server's own timezone.
      - name: go test (TZ=America/New_York)
        run: TZ=America/New_York go test -count=1 ./internal/app/

  web:
    name: Web (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Type check and build
        run: npm run build
